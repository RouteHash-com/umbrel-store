manifestVersion: 1.1
id: routehash-autarki
category: bitcoin
name: Autarki - Wallet / Nostr Shop
version: "0.1.19"
tagline: No platform. Just the sale.
description: >-
  This listing installs on umbrelOS 1.x and umbrelOS 2.0. Autarki is one wallet and one shop on this server. The first screen creates the wallet. Write the 24 words on paper before you leave that screen. The same 99 digits do not rebuild a wallet. This computer adds its own randomness. Those words are the only backup. A password for this copy is optional. Leave both password fields blank and the 24 words are stored unencrypted on this device. A backup of this app is then the seed. Restore the 24 words is on that screen. It shows the first XBT address and does not show the words again. Settings, then Nostr Node, can save a copy of the shop book. That file leaves out the 24 words.


  The page is Shop, Receive, Send, Balance, Ledger, Store, Mining, Classifieds, and Settings. Settings is the gear on the first row. Classifieds stays hidden until you turn on Enable Classifieds. A draft stays on this computer. The categories are Goods, Services, Jobs, Rentals, Giveaways, and Personals. Classifieds use their own node list. An ad can carry up to four image addresses and a map link. Use my location copies the shop's saved place. Search sits to the left of the keyword. Post and Check for orders are icons beside Show Ignored and View blocked. Opening Post hides the ads. A classified ad and a store listing use the same Nostr account. Each connected coin node gets a silent-payment code. The buyer pay card names the chain in the center. A price line reads Price in sats, then an approximate dollar amount, then now at market price. The word price opens the Neoxa market for BTCB2/USDC. A name on a post or an order is the display name that person published, or their name when they published no display name. A click copies the public name. A missing profile stays the short public name. That name is what they wrote. Kind 0 is a profile. A whitelist that should show a name also allows kind 0. If Shop or Classifieds comes back empty, check the Nostr node. If it allows every kind, leave it that way. If it only allows some kinds, allow 30402, 30017, 30018, 10050, and 1059. The Mining tab is on this page once this wallet is open. Paste the API token on Mining, or under Settings. Before that account is saved, Balance says to hire a rig, and the rewards come back to this wallet. After it is saved, Balance lists Open Mining Invoices. At the counter, Pay Counter and the clerk ticket stay on the page. An online shop asks Ship or Pick up, with no default. Pick up pays the shop the same way as the counter. Pick up offers Pay with XBT, Pay with BTC, and Pay with XBTC. Pay with XBTC is there when the XBTC node on this wallet is active and the seller published an XBTC account. It has no Lightning button. Ship offers XBT Lightning and BTC Lightning. On-chain is not offered for a shipment, and a shipment does not offer XBTC. The shop marks it shipped. The customer marks it received. The shop's node holds the coins until then. If the customer does not mark it received, the hold ends and the coins return to the customer. The shop's node has to stay on for that window. Each open order shows Ordered by and a short public name.


  Hire a listed Blake2b rig with XBT, or a listed SHA-256 rig with BTC. Mine writes a Lightning invoice for accepted shares and waits until you click Pay. Paying it starts that rig only. The button says Pay to start on the first invoice, and Pay to keep when that rig is already hashing. Add Hash puts another rig on the same card. Hours from balance uses the confirmed balance for the rig's minimum time. The first click quotes the hire. The second click spends it. Nothing is spent until you click Mine or confirm those hours. The card shows the work still paid for, and counts down while the rig is hashing.


  Ordinary XBT and SHA-256d addresses use Autarki's servers until you connect your own node under Settings, then Coin Nodes. Until then the page gives a normal address. Paying a shop order uses that stall's silent-payment code from that order. A code you type on Send uses your own node. XBTC uses Autarki's public node until you connect your own under Settings, then Coin Nodes. The StartOS package and the Umbrel package do not include that node. Receive, Send, Balance, and the till label ordinary Bitcoin as BTC. Remove this node, under Settings, then Coin Nodes, hides that chain until you press Use this node. When the card is already using Autarki's server, the page says so. Use Autarki's server is shown when a saved login is on that chain. The choice stays in this browser. Blake2b Lightning and SHA-256 Lightning are your own nodes. The seed stays in this wallet. The longer notes on those cards stay closed until you open them.


  Install does not require Bitcoin Knots or Bitcoin Core. On Umbrel you can run Knots for XBT, Knots for XBTC, or Bitcoin Core for SHA-256. XBT Knots and Bitcoin Core do not run on the same computer. XBTC Knots can run on the same computer as XBT Knots. This package does not treat Bitcoin Core as the XBT node. Blake2b Lightning is Lightning Fork, which PaulsCode made for XBT Knots. SHA-256 Lightning is LND, for Bitcoin Core. A giveaway, a personal, or a job you are hiring for can be posted with no coin node. A store catalog can be saved and announced too. Goods, a service, a rental, or a job offered for a price needs the XBT node or the Bitcoin node. One is enough. Buyers pay that shop on-chain after a coin node is connected and you publish the shop again.
releaseNotes: >-
  Version 0.1.19 keeps this app id, so a wallet from 0.1.18 stays. Use other Autarki Lightning nodes is under Settings, then Coin Nodes. On AMD or Intel, leave it off to use the built-in nodes. Turn it on only for another Autarki that stays on. An open channel keeps the built-in nodes running. The Raspberry Pi program in this listing is still the previous page. If the store still shows 0.1.18, remove this community store and add https://github.com/RouteHash-com/umbrel-store again. Remove this node hides that chain. Press Use this node to show it again. When the card is already using Autarki's server, the page says so. Use Autarki's server is shown when a saved login is on that chain. An XBTC balance on Autarki's public node is read in groups of 40 addresses. Shop shows the mark while it looks for shops. Classifieds shows the mark while the first ads load. A classified shipment can fill the postal code from this device. Assign a referee tells that person and the other party. The same 99 digits do not rebuild a wallet. This computer adds its own randomness. The 24 words are the only backup. Use my location fills the postal code and the country code when the lookup has them. A ship-from address is a postal code and a country code. Each product for sale names its weight. An order adds those weights and asks FedEx or Canada Post. Save profile shows a spinner, then says the profile is saved and Publish updates Nostr. Show this shop's key can print a one-page poster. Kind 38385 is a key handoff. A whitelist that should keep a shipment with a new name also allows kind 38385. Save a copy also keeps the profile, the contact list, the mute list, the relay list, the Discord link, vouches, and shipment receipts this wallet has already published. Publish this shop, or publish a classified, sends those notes to the current node. A Blake2b XBT bitcoin mining reward still inside its confirmation wait is explained in plain words, including how much can be sent now. This listing installs on umbrelOS 1.x and umbrelOS 2.0. If the store still shows 0.1.17, remove this community store and add https://github.com/RouteHash-com/umbrel-store again. The Mining tab is on this page once this wallet is open. Paste the API token on Mining, or under Settings. You can hire a listed Blake2b rig with XBT, or a listed SHA-256 rig with BTC. Rewards come back to the next address in this wallet. Nothing is spent until you click Mine or confirm those hours. Shop checkout asks for XBT, BTC, or XBTC. Pay with XBTC is there when the XBTC node on this wallet is active and the shop published an XBTC account. Pay with XBT and Pay with BTC stay. A shipment does not offer XBTC. XBT and BTC can use Lightning. XBTC does not. Creating a wallet says that a blank password stores the 24 words unencrypted on this device. A backup of this service is then the seed. Restore the 24 words is on the create screen. It shows the first XBT address and does not show the words again. A shorter phrase still uses Import a BIP39 phrase. Settings, then Nostr Node, then A copy of the shop, can save the catalog, the orders, the coin journal, and the classifieds. Bring a copy back replaces that book. The file leaves out the 24 words, the wallet file, a secret key, a macaroon, and a node password. The Lightning channel stays on the Lightning node. The stall, each product, and each classified are already notes on the Nostr node. This wallet does not send the shop book to that shared node. A shop that runs its own Nostr node keeps those public notes on that machine. The in-app guide says the same. Pick up on a classified offers Pay with XBT, Pay with BTC, and Pay with XBTC. Lightning sits under XBT and under BTC. Pay with XBTC is there when the XBTC node on this wallet is active and the ad published an XBTC account. It has no Lightning button. Ship offers XBT Lightning and BTC Lightning. On-chain is not offered for a shipment, and a shipment does not offer XBTC. The shop node holds the coins until the order is marked received. When this wallet is the seller, that Lightning payment request comes back on the click. Edit is on your own classified card. My Ads, beside Post, shows the ads saved on this computer. Cancel on the ad form leaves it without saving. Save and Publish return to the board when they succeed. One buyer and one listing stay one unpaid order. The customer ledger names the order, the store, and the store owner. The coin download includes the product, the store, the date, and the charges on that order. With the store off, a classified sale still shows on Check Outs until it is paid, and on Sales after that. A Discord username can be shown beside the shop. The shop and the classified stay public. The link is not required to buy or sell. After a completed shipment, the stall can show how many receipts both keys signed. Classifieds puts Search to the left of the keyword. Post and Check for orders are icons on the same row as Show Ignored and View blocked. Opening Post hides the ads, your ads, and the order notice. A classified ad and a store listing are saved to the same Nostr account on the relay(s); they use the same key. Publishing an ad does not require a store listing. Place notes sit on the Country row. Each connected coin node gets a silent-payment code, so a buyer can pay that chain. The buyer pay card uses the same code picture as a shop order, with the chain name in the center. Coin Nodes explains what a coin node is, where to install it, and what Lightning is. The long notes stay closed until you open them. On Umbrel you can run Knots for XBT, Knots for XBTC, or Bitcoin Core for SHA-256. XBT Knots and Bitcoin Core do not run on the same computer. XBTC Knots can run on the same computer as XBT Knots. Blake2b Lightning is Lightning Fork, which PaulsCode made for XBT Knots. SHA-256 Lightning is LND, for Bitcoin Core. A giveaway, a personal, or a job you are hiring for can be posted with no coin node. A store catalog can be saved and announced too. Goods, a service, a rental, or a job offered for a price needs the XBT node or the Bitcoin node. One is enough. That ad can carry a payment code for each connected node. Buyers pay that shop on-chain after a coin node is connected and you publish the shop again. Classifieds stay hidden until Enable Classifieds is on. Drafts stay on this computer. A name on a post is the name that person published, and a click copies the public name. A whitelist that should show a name also allows kind 0. Settings is the gear. If Shop or Classifieds comes back empty, allow every kind, or allow 30402, 30017, 30018, 10050, and 1059. A classified price line says now at market price, and the word price opens the Neoxa BTCB2/USDC market.


  Receive, Send, Balance, and the till label ordinary Bitcoin as BTC. Under Settings, then SHA-256 Lightning, the save button says Save BTC Lightning. Remove this node, under Settings, then Coin Nodes, hides that chain on Receive, Send, Balance, checkout, Check Outs, and the till. Use this node brings the chain back. The choice stays in this browser. A saved connection stays on this computer.


  The Mining tab is on this page once this wallet is open. Paste the API token on Mining, or under Settings. Hire a listed Blake2b rig with XBT, or a listed SHA-256 rig with BTC. Mine writes a Lightning invoice for accepted shares and waits until Pay. Paying it starts that rig only. Hours from balance spends the confirmed balance for the rig's minimum time, after a second confirmation. Add Hash, Pay to start, and Pay to keep are on the card. Before that account is saved, Balance says to hire a rig. After it is saved, Open Mining Invoices follows that account.


  An online shop asks Ship or Pick up, with no default. Ship offers XBT Lightning and BTC Lightning. On-chain is not offered for a shipment. The shop marks it shipped. The customer marks it received. The shop's node holds the coins until then. If the customer does not mark it received, the hold ends and the coins return to the customer. On a customer wallet, the open order stays on Shop.


  A PC, Umbrel Home, and Umbrel Pro use the amd64 program. A Raspberry Pi uses the arm64 program.
